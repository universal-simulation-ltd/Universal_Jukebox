# The Vitest suite and the tag-reader self-test (scripts/selftest.mjs, against
# committed mutagen-written fixtures), on every push and pull request. No
# server, no browser. Node 24 strips the TypeScript types the self-test imports.
#
# Deploy (deploy.yml) runs the same two before it ships main; this is the
# same check on every branch and pull request, and a result per main commit.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The desktop app's Electron binary is ~100MB and nothing here runs it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test
      - run: npm run test:tags
